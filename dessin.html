<head>

<style>
  :root {
    --mauve: #9B6B8A; --bleu: #7B9BBE;
    --fond: #f7f5f6; --texte: #2a2630; --texte-doux: #8a8290;
    --bordure: rgba(0,0,0,0.07); --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fond); color: var(--texte);
    overscroll-behavior: none;
  }
  body { max-width: 430px; margin: 0 auto; min-height: 100dvh; padding-bottom: 88px; }

  /* Masqué tant que la connexion n'est pas confirmée (évite le flash de login) */
  #contenu-app { display: none; }

  .topbar {
    background: linear-gradient(160deg, #9B6B8A, #7B9BBE);
    padding: calc(env(safe-area-inset-top) + 18px) 20px 16px;
    color: #fff; border-radius: 0 0 24px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar h1 { font-size: 20px; font-weight: 600; }
  .topbar .statut { font-size: 11px; opacity: 0.85; }

  .zone-dessin { padding: 14px; }

  .canvas-cadre {
    background: #1a1a2e; border-radius: 20px; overflow: hidden;
    position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.08);
  }
  #canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
  .canvas-info {
    position: absolute; top: 10px; left: 12px;
    font-size: 10px; color: rgba(255,255,255,0.4);
    pointer-events: none; transition: opacity 0.3s;
  }
  #chargement-canvas {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #1a1a2e; color: rgba(255,255,255,0.5); font-size: 13px;
  }

  .outils {
    margin-top: 14px; background: white; border-radius: var(--radius);
    border: 1px solid var(--bordure); padding: 14px;
  }
  .ligne-outils { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ligne-outils:last-child { margin-bottom: 0; }
  .ligne-label { font-size: 11px; color: var(--texte-doux); font-weight: 600; width: 60px; flex-shrink: 0; }

  .couleurs { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .pastille {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: transform 0.1s;
  }
  .pastille.active { border-color: var(--texte); transform: scale(1.12); }
  .pastille:active { transform: scale(0.92); }

  .epaisseurs { display: flex; gap: 8px; flex: 1; align-items: center; }
  .ep-btn {
    flex: 1; height: 36px; border-radius: 10px; border: 1.5px solid var(--bordure);
    background: #fafafa; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .ep-btn.active { border-color: var(--mauve); background: #f3eaef; }
  .ep-btn .point { background: var(--texte); border-radius: 50%; }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button {
    border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; padding: 14px; transition: transform 0.1s;
  }
  .actions button:active { transform: scale(0.97); }
  .btn-effacer { background: #f0eef0; color: var(--texte); flex: 0 0 auto; padding: 14px 18px; }
  .btn-envoyer { background: var(--mauve); color: white; flex: 1; }
  .btn-envoyer:disabled { opacity: 0.6; }

  .info-tableau {
    margin: 14px; background: #f3eaef; border-radius: 12px;
    padding: 10px 14px; font-size: 12px; color: var(--mauve);
    display: flex; align-items: center; gap: 8px; line-height: 1.4;
  }
  .info-tableau svg { width: 16px; height: 16px; flex-shrink: 0; }
  .info-tableau .maj { font-size: 11px; opacity: 0.75; }

  #progression {
    display: none; position: fixed; top: 0; left: 0; right: 0;
    height: 3px; background: var(--mauve); z-index: 200; width: 0%; transition: width 0.3s;
  }

  .nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--bordure);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px); z-index: 100;
  }
  .nav a {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: var(--texte-doux);
    font-size: 9px; font-weight: 500; flex: 1; padding: 4px 0;
  }
  .nav a.actif { color: var(--mauve); }
  .nav a svg { width: 23px; height: 23px; }
</style>

<div id="contenu-app">

    </div>
  </div>

  <div class="zone-dessin">
    <div class="canvas-cadre">
      <canvas id="canvas"></canvas>

      <div id="chargement-canvas">Chargement de la toile…</div>

    <div class="outils">
      <div class="ligne-outils">

        <div class="couleurs" id="couleurs"></div>
      </div>
      <div class="ligne-outils">
        <span class="ligne-label">Épaisseur</span>

    </div>

    <div class="actions">
      <button class="btn-effacer" id="btn-effacer">Tout effacer</button>
      <button class="btn-envoyer" id="btn-envoyer">Enregistrer 💌</button>
    </div>
  </div>

  <div class="info-tableau">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>Une seule toile partagée : dessinez chacun votre tour. <span class="maj" id="derniere-maj"></span></span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
// On gère l'auth ici (sans flash) : tant que pas confirmé, on n'affiche rien d'utile
let monPrenom = "";
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "index.html";
    return;
  }
  document.getElementById("contenu-app").style.display = "block";
  monPrenom = prenomDepuisEmail(user.email);
  initCanvas();
  await chargerToile();
});

function prenomDepuisEmail(email) {
  const A = COUPLE.personneA, B = COUPLE.personneB;
  const local = (email || "").toLowerCase();
  if (local.includes(A.prenom.toLowerCase())) return A.prenom;
  if (local.includes(B.prenom.toLowerCase())) return B.prenom;
  return "Quelqu'un";
}

// ====== CANVAS ======
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let dessine = false;
let dernierX = 0, dernierY = 0;
let couleurActuelle = "#ff9eb5";
let epaisseurActuelle = 4;
let canvasPret = false;

function initCanvas() {
  if (canvasPret) return;
  canvasPret = true;
  const ratio = window.devicePixelRatio || 1;
  const largeur = canvas.offsetWidth;
  const hauteur = Math.round(largeur * 0.9);
  canvas.width = largeur * ratio;
  canvas.height = hauteur * ratio;
  canvas.style.height = hauteur + "px";
  ctx.scale(ratio, ratio);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  fondSombre();
  brancherEvenements();
}

function fondSombre() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

// ====== CHARGER LA TOILE COMMUNE depuis Firebase ======
async function chargerToile() {
  // Sécurité : on masque l'écran de chargement au bout de 4s quoi qu'il arrive
  const secu = setTimeout(() => {
    document.getElementById("chargement-canvas").style.display = "none";
  }, 4000);
  try {
    const doc = await db.collection("tableau").doc("commun").get();
    if (doc.exists && doc.data().url) {
      const d = doc.data();
      await dessinerImageDeFond(d.url);
      majInfoMaj(d.auteur, d.date);
    }
  } catch (e) {
    console.log("Pas de toile existante :", e.message);
  }
  clearTimeout(secu);
  document.getElementById("chargement-canvas").style.display = "none";
}

function dessinerImageDeFond(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    let fini = false;
    const termine = () => { if (!fini) { fini = true; resolve(); } };
    img.onload = () => {
      const l = canvas.offsetWidth;
      const h = Math.round(l * 0.9);
      ctx.drawImage(img, 0, 0, l, h);
      termine();
    };
    img.onerror = () => { console.log("Erreur chargement image toile"); termine(); };
    setTimeout(termine, 3500); // sécurité : ne bloque jamais plus de 3,5s
    img.src = url;
  });
}

function majInfoMaj(auteur, timestamp) {
  const el = document.getElementById("derniere-maj");
  if (!auteur) { el.textContent = ""; return; }
  let quand = "";
  if (timestamp && timestamp.toDate) {
    const date = timestamp.toDate();
    const sec = Math.floor((Date.now() - date) / 1000);
    if (sec < 60) quand = "à l'instant";
    else if (sec < 3600) quand = "il y a " + Math.floor(sec / 60) + " min";
    else if (sec < 86400) quand = "il y a " + Math.floor(sec / 3600) + " h";
    else quand = "il y a " + Math.floor(sec / 86400) + " j";
  }
  el.textContent = "Dernière touche : " + auteur + (quand ? " · " + quand : "");
}

// ====== DESSIN ======
function position(e) {
  const rect = canvas.getBoundingClientRect();
  const point = e.touches ? e.touches[0] : e;
  return { x: point.clientX - rect.left, y: point.clientY - rect.top };
}
function debut(e) {
  e.preventDefault();
  dessine = true;
  const p = position(e);
  dernierX = p.x; dernierY = p.y;
  ctx.beginPath();
  ctx.arc(p.x, p.y, epaisseurActuelle / 2, 0, Math.PI * 2);
  ctx.fillStyle = couleurActuelle;
  ctx.fill();
  // cache l'indice "dessine avec ton doigt" au premier trait
  document.getElementById("canvas-info").style.opacity = "0";
}
function bouge(e) {
  if (!dessine) return;
  e.preventDefault();
  const p = position(e);
  ctx.beginPath();
  ctx.moveTo(dernierX, dernierY);
  ctx.lineTo(p.x, p.y);
  ctx.strokeStyle = couleurActuelle;
  ctx.lineWidth = epaisseurActuelle;
  ctx.stroke();
  dernierX = p.x; dernierY = p.y;
}
function fin(e) { if (e) e.preventDefault(); dessine = false; }

function brancherEvenements() {
  canvas.addEventListener("mousedown", debut);
  canvas.addEventListener("mousemove", bouge);
  canvas.addEventListener("mouseup", fin);
  canvas.addEventListener("mouseout", fin);
  canvas.addEventListener("touchstart", debut, { passive: false });
  canvas.addEventListener("touchmove", bouge, { passive: false });
  canvas.addEventListener("touchend", fin, { passive: false });
}

// ====== COULEURS ======
const palette = ["#ff9eb5", "#9eb5ff", "#ffffff", "#ffe066", "#7ee0a0", "#ff8a5c", "#c89eff", "#000000"];
const contCouleurs = document.getElementById("couleurs");
palette.forEach((c, i) => {
  const p = document.createElement("div");
  p.className = "pastille" + (i === 0 ? " active" : "");
  p.style.background = c;
  if (c === "#ffffff") p.style.border = "3px solid #ddd";
  p.addEventListener("click", () => {
    couleurActuelle = c;
    document.querySelectorAll(".pastille").forEach(x => x.classList.remove("active"));
    p.classList.add("active");
    if (c === "#ffffff") p.style.border = "3px solid var(--texte)";
  });
  contCouleurs.appendChild(p);
});

// ====== ÉPAISSEURS ======
const tailles = [{ ep: 2, taille: 6 }, { ep: 4, taille: 10 }, { ep: 8, taille: 16 }, { ep: 14, taille: 22 }];
const contEp = document.getElementById("epaisseurs");
tailles.forEach((t, i) => {
  const b = document.createElement("div");
  b.className = "ep-btn" + (i === 1 ? " active" : "");
  const point = document.createElement("div");
  point.className = "point";
  point.style.width = t.taille + "px";
  point.style.height = t.taille + "px";
  b.appendChild(point);
  b.addEventListener("click", () => {
    epaisseurActuelle = t.ep;
    document.querySelectorAll(".ep-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
  });
  contEp.appendChild(b);
});

// ====== TOUT EFFACER ======
document.getElementById("btn-effacer").addEventListener("click", () => {
  if (!confirm("Effacer toute la toile et repartir d'une page blanche ?")) return;
  fondSombre();
  document.getElementById("canvas-info").style.opacity = "1";
});

// ====== ENREGISTRER (remplace la toile commune) ======
const btnEnvoyer = document.getElementById("btn-envoyer");
const progression = document.getElementById("progression");

btnEnvoyer.addEventListener("click", () => {
  btnEnvoyer.disabled = true;
  progression.style.display = "block";
  progression.style.width = "15%";

  canvas.toBlob(async (blob) => {
    try {
      // Toujours le même fichier : on écrase la toile précédente
      const nom = "tableau/commun.png";
      const ref = storage.ref().child(nom);
      const tache = ref.put(blob);
      tache.on("state_changed",
        (snap) => { progression.style.width = ((snap.bytesTransferred / snap.totalBytes) * 80 + 15) + "%"; },
        (err) => { alert("Erreur : " + err.message); btnEnvoyer.disabled = false; progression.style.display = "none"; },
        async () => {
          const url = await tache.snapshot.ref.getDownloadURL();
          // Document unique "commun" : on le met à jour (set), pas d'historique
          await db.collection("tableau").doc("commun").set({
            url: url,
            chemin: nom,
            auteur: monPrenom,
            date: firebase.firestore.FieldValue.serverTimestamp()
          });
          progression.style.width = "100%";
          setTimeout(() => {
            progression.style.display = "none"; progression.style.width = "0%";
            btnEnvoyer.disabled = false;
            document.getElementById("statut").textContent = "Enregistré ! 💕";
            majInfoMaj(monPrenom, { toDate: () => new Date() });
          }, 400);
        }
      );
    } catch (err) {
      alert("Erreur : " + err.message);
      btnEnvoyer.disabled = false; progression.style.display = "none";
    }
  }, "image/png");
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
