<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#9B6B8A">
<title>Nous</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --mauve: #9B6B8A;
    --bleu: #7B9BBE;
    --mauve-clair: #f3eaef;
    --bleu-clair: #eaf0f6;
    --fond: #f7f5f6;
    --texte: #2a2630;
    --texte-doux: #8a8290;
    --carte: #ffffff;
    --bordure: rgba(0,0,0,0.07);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fond);
    color: var(--texte);
    overscroll-behavior: none;
  }
  body {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
  }

  /* ---------- ÉCRAN DE CONNEXION ---------- */
  #login {
    min-height: 100vh;
    min-height: 100dvh;
    display: none; /* masqué au départ, affiché seulement si non connecté (évite le flash) */
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, #9B6B8A 0%, #7B9BBE 100%);
  }
  #login .logo {
    font-size: 56px;
    margin-bottom: 8px;
  }
  #login h1 {
    color: white;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  #login .sous {
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    margin-bottom: 36px;
  }
  .login-carte {
    background: white;
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }
  .login-carte input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--bordure);
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 12px;
    background: #fafafa;
    transition: border-color 0.2s;
  }
  .login-carte input:focus {
    outline: none;
    border-color: var(--mauve);
    background: white;
  }
  .login-carte button {
    width: 100%;
    padding: 15px;
    background: var(--mauve);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .login-carte button:active { transform: scale(0.98); }
  .login-carte button:disabled { opacity: 0.6; }
  #login-erreur {
    color: #d14343;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
  }

  /* ---------- APP ---------- */
  #app { display: none; padding-bottom: 88px; }

  .entete {
    background: linear-gradient(160deg, #9B6B8A 0%, #7B9BBE 100%);
    padding: calc(env(safe-area-inset-top) + 20px) 20px 22px;
    color: white;
    border-radius: 0 0 28px 28px;
  }
  .horloges {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .personne { text-align: center; flex: 1; }
  .personne .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
    margin: 0 auto 6px;
  }
  .personne .ville { font-size: 11px; opacity: 0.8; margin-bottom: 2px; }
  .personne .heure { font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -0.5px; }
  .personne .heure .min { font-size: 15px; opacity: 0.85; }
  .personne .date-locale { font-size: 10px; opacity: 0.7; margin-top: 3px; }
  .centre-coeur {
    display: flex; flex-direction: column; align-items: center;
    padding: 0 6px; padding-top: 10px;
  }
  .centre-coeur .coeur { font-size: 22px; animation: battement 2s ease-in-out infinite; }
  @keyframes battement {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .centre-coeur .compteur {
    font-size: 11px; text-align: center; margin-top: 6px;
    line-height: 1.2; font-weight: 600;
  }
  .centre-coeur .compteur small { font-weight: 400; opacity: 0.75; font-size: 9px; }

  .contenu { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .titre-section {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--texte-doux);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .grille-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .carte {
    background: var(--carte);
    border-radius: var(--radius);
    border: 1px solid var(--bordure);
    overflow: hidden;
  }
  .carte-lien { cursor: pointer; transition: transform 0.1s; text-decoration: none; color: inherit; display: block; }
  .carte-lien:active { transform: scale(0.98); }

  .apercu {
    height: 130px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: var(--mauve-clair);
  }
  .apercu img { width: 100%; height: 100%; object-fit: cover; }
  .apercu .vide { color: var(--texte-doux); font-size: 28px; opacity: 0.5; }
  .apercu-dessin { background: #1a1a2e; }
  .apercu-label {
    padding: 8px 12px 4px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--texte-doux); font-weight: 600;
  }
  .apercu-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.5));
    padding: 18px 10px 8px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .apercu-overlay .qui { font-size: 11px; color: white; font-weight: 600; }
  .apercu-overlay .quand { font-size: 10px; color: rgba(255,255,255,0.8); }

  .meteo-carte { padding: 14px; }
  .meteo-carte .val { font-size: 22px; font-weight: 600; }
  .meteo-carte .lieu { font-size: 10px; color: var(--texte-doux); margin-top: 2px; }

  .agenda-carte { padding: 14px; }
  .evt {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--bordure);
  }
  .evt:last-child { border-bottom: none; }
  .evt .point { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .evt .titre-evt { font-size: 14px; flex: 1; }
  .evt .badge {
    font-size: 11px; font-weight: 600;
    background: var(--bleu-clair); color: var(--bleu);
    padding: 4px 10px; border-radius: 10px; white-space: nowrap;
  }
  .agenda-vide { text-align: center; color: var(--texte-doux); font-size: 13px; padding: 16px 0; }

  /* ---------- BARRE DE NAVIGATION ---------- */
  .nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--bordure);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px);
    z-index: 100;
  }
  .nav a {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: var(--texte-doux);
    font-size: 9px; font-weight: 500;
    flex: 1; padding: 4px 0;
  }
  .nav a.actif { color: var(--mauve); }
  .nav a svg { width: 23px; height: 23px; }

  .deconnexion {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 16px);
    right: 16px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .deconnexion svg { width: 18px; height: 18px; }

  .chargement { text-align: center; color: var(--texte-doux); font-size: 13px; padding: 40px 0; }

  /* ========== AMÉLIORATIONS FLUIDITÉ & ANIMATIONS ========== */

  /* View Transitions : fondu doux entre les pages */
  @view-transition { navigation: auto; }
  @keyframes fonduEntree { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fonduSortie { from { opacity: 1; } to { opacity: 0; } }
  ::view-transition-old(root) { animation: fonduSortie 0.18s ease both; }
  ::view-transition-new(root) { animation: fonduEntree 0.22s ease both; }

  /* La barre du bas ne fait JAMAIS partie de la transition (elle reste fixe) */
  .nav { view-transition-name: barre-nav; }
  ::view-transition-old(barre-nav),
  ::view-transition-new(barre-nav) { animation: none; }

  /* Fond de sécurité en bas harmonisé avec la barre (corrige le "blanc" sous la nav) */

  /* Apparition douce des cartes au chargement */
  @keyframes monteeDouce {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .contenu > *, .zone-dessin > *, .contenu .carte, .grille-2, .grille-photos {
    animation: monteeDouce 0.4s ease both;
  }
  .contenu > *:nth-child(1) { animation-delay: 0.02s; }
  .contenu > *:nth-child(2) { animation-delay: 0.08s; }
  .contenu > *:nth-child(3) { animation-delay: 0.14s; }
  .contenu > *:nth-child(4) { animation-delay: 0.20s; }

  /* Boutons et liens plus réactifs au toucher */
  .nav a { transition: color 0.2s ease, transform 0.1s ease; }
  .nav a:active { transform: scale(0.9); }
  .carte-lien { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .carte-lien:active { transform: scale(0.97); }

  /* Respecte les préférences "réduire les animations" (accessibilité) */
  @media (prefers-reduced-motion: reduce) {
    *, ::view-transition-old(root), ::view-transition-new(root) {
      animation: none !important;
      transition: none !important;
    }
  }

</style>
</head>
<body>

<!-- ========== ÉCRAN DE CONNEXION ========== -->
<div id="login">
  <div class="logo">💑</div>
  <h1>Nous</h1>
  <div class="sous">Antoine & Silvia</div>
  <div class="login-carte">
    <input type="email" id="email" placeholder="Adresse email" autocomplete="email">
    <input type="password" id="motdepasse" placeholder="Mot de passe" autocomplete="current-password">
    <button id="btn-login">Se connecter</button>
    <div id="login-erreur"></div>

</div>

<!-- ========== APPLICATION ========== -->
<div id="app">
  <div class="entete">
    <button class="deconnexion" id="btn-deconnexion" title="Se déconnecter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>

      <div class="personne">
        <div class="avatar" id="av-a">A</div>

        <div class="date-locale" id="date-a">--</div>
      </div>
      <div class="centre-coeur">
        <div class="coeur">♡</div>
        <div class="compteur" id="compteur"><span id="jours">--</span><br><small>jours</small></div>
      </div>
      <div class="personne">
        <div class="avatar" id="av-b">S</div>
        <div class="ville" id="ville-b">Nouvelle-Orléans 🇺🇸</div>

  <div class="contenu">
    <!-- Photo + Dessin -->
    <div class="grille-2">

          <div class="vide">📷</div>
        </div>
      </a>
      <a class="carte carte-lien" href="dessin.html">
        <div class="apercu-label">Dernier dessin</div>
        <div class="apercu apercu-dessin" id="apercu-dessin">
          <div class="vide" style="color:#6a6a8e">✏️</div>
        </div>

    <div>
      <div class="titre-section">Météo</div>

        </div>
        <div class="carte meteo-carte">
          <div class="val" id="meteo-b">--</div>
          <div class="lieu" id="meteo-lieu-b">Nouvelle-Orléans</div>
        </div>
      </div>
    </div>

    <!-- Agenda -->
    <div>
      <div class="titre-section">Prochains moments</div>
      <a class="carte agenda-carte carte-lien" href="agenda.html" id="bloc-agenda">
        <div class="agenda-vide">Chargement…</div>
      </a>
    </div>
  </div>
</div>

<!-- ========== BARRE DE NAVIGATION ========== -->
<nav class="nav" id="nav" style="display:none">
  <a href="index.html" class="actif">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

<!-- ========== SCRIPTS FIREBASE ========== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
// ====== CONNEXION ======
const btnLogin = document.getElementById("btn-login");
const erreurLogin = document.getElementById("login-erreur");

btnLogin.addEventListener("click", seConnecter);
document.getElementById("motdepasse").addEventListener("keypress", (e) => {
  if (e.key === "Enter") seConnecter();
});

function seConnecter() {
  const email = document.getElementById("email").value.trim();
  const mdp = document.getElementById("motdepasse").value;
  if (!email || !mdp) { erreurLogin.textContent = "Remplis les deux champs."; return; }
  btnLogin.disabled = true;
  erreurLogin.textContent = "";
  auth.signInWithEmailAndPassword(email, mdp)
    .catch((err) => {
      btnLogin.disabled = false;
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
        erreurLogin.textContent = "Email ou mot de passe incorrect.";
      } else if (err.code === "auth/invalid-email") {
        erreurLogin.textContent = "Adresse email invalide.";
      } else {
        erreurLogin.textContent = "Erreur : " + err.message;
      }
    });
}

document.getElementById("btn-deconnexion").addEventListener("click", () => {
  auth.signOut();
});

// ====== BASCULE LOGIN / APP ======
auth.onAuthStateChanged((user) => {
  if (user) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("nav").style.display = "flex";
    demarrerAccueil();
  } else {
    document.getElementById("login").style.display = "flex";
    document.getElementById("app").style.display = "none";
    document.getElementById("nav").style.display = "none";
  }
});

// ====== ACCUEIL ======
let accueilDemarre = false;
function demarrerAccueil() {
  if (accueilDemarre) return;
  accueilDemarre = true;

  // Personnaliser depuis COUPLE
  const A = COUPLE.personneA, B = COUPLE.personneB;
  document.getElementById("av-a").textContent = A.prenom[0];
  document.getElementById("av-b").textContent = B.prenom[0];
  document.getElementById("ville-a").textContent = A.ville + " " + A.drapeau;
  document.getElementById("ville-b").textContent = B.ville + " " + B.drapeau;
  document.getElementById("meteo-lieu-a").textContent = A.ville;
  document.getElementById("meteo-lieu-b").textContent = B.ville;

  majHorloges();
  setInterval(majHorloges, 1000);
  majCompteurJours();
  chargerMeteo();
  ecouterApercus();
  ecouterAgenda();
}

// --- Horloges en temps réel ---
function majHorloges() {
  const A = COUPLE.personneA, B = COUPLE.personneB;
  afficherHeure("heure-a", "date-a", A.timezone);
  afficherHeure("heure-b", "date-b", B.timezone);
}
function afficherHeure(idHeure, idDate, tz) {
  const maintenant = new Date();
  const h = new Intl.DateTimeFormat("fr-FR", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }).format(maintenant);
  const [heure, minute] = h.split(":");
  document.getElementById(idHeure).innerHTML = heure + '<span class="min">:' + minute + '</span>';
  const d = new Intl.DateTimeFormat("fr-FR", { timeZone: tz, weekday: "short", day: "numeric", month: "short" }).format(maintenant);
  document.getElementById(idDate).textContent = d;
}

// --- Compteur de jours ---
function majCompteurJours() {
  const debut = new Date(COUPLE.dateDebut + "T00:00:00");
  const maintenant = new Date();
  const jours = Math.floor((maintenant - debut) / (1000 * 60 * 60 * 24));
  document.getElementById("jours").textContent = jours;
}

// --- Météo (open-meteo, gratuit, sans clé) ---
async function chargerMeteo() {
  chargerMeteoVille(COUPLE.personneA, "meteo-a");
  chargerMeteoVille(COUPLE.personneB, "meteo-b");
}
async function chargerMeteoVille(p, id) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,weather_code`;
    const r = await fetch(url);
    const data = await r.json();
    const temp = Math.round(data.current.temperature_2m);
    const emoji = emojiMeteo(data.current.weather_code);
    document.getElementById(id).textContent = `${emoji} ${temp}°`;
  } catch (e) {
    document.getElementById(id).textContent = "indispo";
  }
}
function emojiMeteo(code) {
  if (code === 0) return "☀️";
  if (code <= 2) return "⛅";
  if (code === 3) return "☁️";
  if (code <= 48) return "🌫️";
  if (code <= 67) return "🌧️";
  if (code <= 77) return "🌨️";
  if (code <= 82) return "🌦️";
  if (code <= 86) return "🌨️";
  if (code >= 95) return "⛈️";
  return "🌡️";
}

// --- Aperçus photo & dessin (temps réel) ---
function ecouterApercus() {
  // Dernière photo
  db.collection("photos").orderBy("date", "desc").limit(1)
    .onSnapshot((snap) => {
      const cont = document.getElementById("apercu-photo");
      if (snap.empty) { cont.innerHTML = '<div class="vide">📷</div>'; return; }
      const p = snap.docs[0].data();
      cont.innerHTML = `<img src="${p.url}" alt="photo">
        <div class="apercu-overlay">
          <div class="qui">${p.auteur || ""}</div>
          <div class="quand">${tempsEcoule(p.date)}</div>
        </div>`;
    });

  // Toile partagée commune (document unique)
  db.collection("tableau").doc("commun")
    .onSnapshot((doc) => {
      const cont = document.getElementById("apercu-dessin");
      const data = doc.exists ? doc.data() : null;
      // On accepte le nouveau champ "image" (data URL) OU l'ancien "url" (compatibilité)
      const source = data ? (data.image || data.url) : null;
      if (!source) {
        cont.innerHTML = '<div class="vide" style="color:#6a6a8e">✏️</div>';
        return;
      }
      // Construction propre des éléments (évite tout souci avec les longues data URLs)
      cont.innerHTML = "";
      const img = document.createElement("img");
      img.alt = "dessin";
      img.src = source;
      const overlay = document.createElement("div");
      overlay.className = "apercu-overlay";
      overlay.innerHTML = `<div class="qui">${data.auteur || ""}</div>
        <div class="quand">${tempsEcoule(data.date)}</div>`;
      cont.appendChild(img);
      cont.appendChild(overlay);
    }, (err) => {
      console.error("Erreur aperçu dessin :", err);
    });
}

// --- Agenda (3 prochains événements) ---
function ecouterAgenda() {
  const maintenant = new Date();
  db.collection("evenements").orderBy("date", "asc")
    .onSnapshot((snap) => {
      const bloc = document.getElementById("bloc-agenda");
      const futurs = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(e => e.date && e.date.toDate() >= maintenant)
        .slice(0, 3);
      if (futurs.length === 0) {
        bloc.innerHTML = '<div class="agenda-vide">Aucun moment prévu.<br>Ajoutez-en un ! →</div>';
        return;
      }
      let html = "";
      futurs.forEach((e, i) => {
        const couleur = i % 2 === 0 ? "#9B6B8A" : "#7B9BBE";
        html += `<div class="evt">
          <div class="point" style="background:${couleur}"></div>
          <div class="titre-evt">${echapper(e.titre)}</div>
          <div class="badge">${compteARebours(e.date)}</div>
        </div>`;
      });
      bloc.innerHTML = html;
    });
}

// ====== UTILITAIRES ======
function tempsEcoule(timestamp) {
  if (!timestamp) return "";
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const sec = Math.floor((Date.now() - date) / 1000);
  if (sec < 60) return "à l'instant";
  if (sec < 3600) return "il y a " + Math.floor(sec / 60) + " min";
  if (sec < 86400) return "il y a " + Math.floor(sec / 3600) + " h";
  return "il y a " + Math.floor(sec / 86400) + " j";
}
function compteARebours(timestamp) {
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const diff = date - Date.now();
  const jours = Math.floor(diff / (1000 * 60 * 60 * 24));
  const heures = Math.floor(diff / (1000 * 60 * 60));
  if (jours >= 1) return "dans " + jours + " j";
  if (heures >= 1) return "dans " + heures + " h";
  if (diff > 0) return "bientôt";
  return "maintenant";
}
function echapper(txt) {
  const div = document.createElement("div");
  div.textContent = txt || "";
  return div.innerHTML;
}

// ====== SERVICE WORKER (PWA) ======
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
