<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#9B6B8A">
<title>Notes — Nous</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --mauve: #9B6B8A; --bleu: #7B9BBE;
    --fond: #f7f5f6; --texte: #2a2630; --texte-doux: #8a8290;
    --carte: #ffffff; --bordure: rgba(0,0,0,0.07); --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fond); color: var(--texte); overscroll-behavior: none;
  }
  body { max-width: 430px; margin: 0 auto; min-height: 100dvh; padding-bottom: 88px; }

  #contenu-app { display: none; }

  .topbar {
    background: linear-gradient(160deg, #9B6B8A, #7B9BBE);
    padding: calc(env(safe-area-inset-top) + 20px) 20px 20px;
    color: white; border-radius: 0 0 28px 28px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar h1 { font-size: 22px; font-weight: 600; }
  .topbar .etat-sauvegarde {
    font-size: 11px; opacity: 0.85; display: flex; align-items: center; gap: 5px;
    min-height: 16px;
  }
  .topbar .etat-sauvegarde .pastille-etat {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.5);
    transition: background 0.3s;
  }
  .topbar .etat-sauvegarde.sauve .pastille-etat { background: #7ee0a0; }
  .topbar .etat-sauvegarde.en-cours .pastille-etat { background: #ffe066; }

  .contenu { padding: 16px; }

  .zone-note {
    background: var(--carte); border-radius: var(--radius);
    border: 1px solid var(--bordure); padding: 4px;
    min-height: 60vh; display: flex;
  }
  #note {
    width: 100%; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 16px; line-height: 1.6;
    color: var(--texte); background: transparent;
    padding: 14px; min-height: 60vh;
  }
  #note::placeholder { color: var(--texte-doux); }

  .info-notes {
    margin-top: 14px; background: #f3eaef; border-radius: 12px;
    padding: 10px 14px; font-size: 12px; color: var(--mauve);
    display: flex; align-items: center; gap: 8px; line-height: 1.4;
  }
  .info-notes svg { width: 16px; height: 16px; flex-shrink: 0; }
  .info-notes .maj { display: block; font-size: 11px; opacity: 0.75; margin-top: 2px; }

  .nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--bordure);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px); z-index: 100;
  }
  .nav a {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: var(--texte-doux);
    font-size: 9px; font-weight: 500; flex: 1; padding: 4px 0;
  }
  .nav a.actif { color: var(--mauve); }
  .nav a svg { width: 23px; height: 23px; }
</style>
</head>
<body>

<div id="contenu-app">
  <div class="topbar">
    <div>
      <h1>Nos notes</h1>
      <div class="etat-sauvegarde" id="etat"><span class="pastille-etat"></span><span id="etat-txt">Chargement…</span></div>
    </div>
  </div>

  <div class="contenu">
    <div class="zone-note">
      <textarea id="note" placeholder="Écrivez ici à deux…&#10;&#10;🛒 Courses : lait, œufs, pâtes&#10;🎬 Films à voir : Inception, Amélie Poulain&#10;💡 Idées : week-end à la mer ?&#10;&#10;Tout ce que vous tapez est partagé en temps réel."></textarea>
    </div>

    <div class="info-notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>Bloc-notes partagé, sauvegarde automatique.<span class="maj" id="derniere-maj"></span></span>
    </div>
  </div>
</div>

<nav class="nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Accueil
  </a>
  <a href="photos.html">

    Photos
  </a>
  <a href="agenda.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
let monPrenom = "";
auth.onAuthStateChanged((user) => {
  if (!user) { window.location.href = "index.html"; return; }
  document.getElementById("contenu-app").style.display = "block";
  monPrenom = prenomDepuisEmail(user.email);
  ecouterNote();
});

function prenomDepuisEmail(email) {
  const A = COUPLE.personneA, B = COUPLE.personneB;
  const local = (email || "").toLowerCase();
  if (local.includes(A.prenom.toLowerCase())) return A.prenom;
  if (local.includes(B.prenom.toLowerCase())) return B.prenom;
  return "Quelqu'un";
}

const textarea = document.getElementById("note");
const etat = document.getElementById("etat");
const etatTxt = document.getElementById("etat-txt");

let enTrainDeTaper = false;
let minuteur = null;
let premierChargement = true;

// ---- Écoute en temps réel : si l'autre modifie, on met à jour ----
function ecouterNote() {
  db.collection("notes").doc("commune")
    .onSnapshot((doc) => {
      // On ne remplace PAS le texte si l'utilisateur est en train de taper
      // (sinon on écraserait ce qu'il écrit)
      if (enTrainDeTaper) return;

      if (doc.exists) {
        const d = doc.data();
        // On ne réécrit que si le contenu est différent (évite de bouger le curseur)
        if (textarea.value !== (d.texte || "")) {
          textarea.value = d.texte || "";
        }
        majInfoMaj(d.auteur, d.date);
        marquerSauve();
      } else {
        marquerSauve();
      }
      if (premierChargement) {
        premierChargement = false;
        etatTxt.textContent = "À jour";
      }
    }, (err) => {
      console.error("Erreur notes :", err);
      etatTxt.textContent = "Erreur de connexion";
    });
}

// ---- Quand l'utilisateur tape : sauvegarde automatique après 0,8s d'inactivité ----
textarea.addEventListener("input", () => {
  enTrainDeTaper = true;
  marquerEnCours();
  clearTimeout(minuteur);
  minuteur = setTimeout(() => {
    sauvegarder();
  }, 800);
});

// Quand on quitte le champ, on sauvegarde tout de suite
textarea.addEventListener("blur", () => {
  if (enTrainDeTaper) sauvegarder();
});

async function sauvegarder() {
  clearTimeout(minuteur);
  try {
    await db.collection("notes").doc("commune").set({
      texte: textarea.value,
      auteur: monPrenom,
      date: firebase.firestore.FieldValue.serverTimestamp()
    });
    enTrainDeTaper = false;
    marquerSauve();
  } catch (e) {
    etatTxt.textContent = "Erreur de sauvegarde";
    console.error(e);
  }
}

function marquerEnCours() {
  etat.className = "etat-sauvegarde en-cours";
  etatTxt.textContent = "Sauvegarde…";
}
function marquerSauve() {
  etat.className = "etat-sauvegarde sauve";
  etatTxt.textContent = "À jour";
}

function majInfoMaj(auteur, timestamp) {
  const el = document.getElementById("derniere-maj");
  if (!auteur) { el.textContent = ""; return; }
  let quand = "";
  if (timestamp && timestamp.toDate) {
    const date = timestamp.toDate();
    const sec = Math.floor((Date.now() - date) / 1000);
    if (sec < 60) quand = "à l'instant";
    else if (sec < 3600) quand = "il y a " + Math.floor(sec / 60) + " min";
    else if (sec < 86400) quand = "il y a " + Math.floor(sec / 3600) + " h";
    else quand = "il y a " + Math.floor(sec / 86400) + " j";
  }
  el.textContent = "Dernière modif : " + auteur + (quand ? " · " + quand : "");
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
